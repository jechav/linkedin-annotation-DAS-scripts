name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          PATH_SSH_GH_KEY: ${{ secrets.PATH_SSH_GH_KEY }}
        with:
          host: ${{ secrets.ECHAMOR_DROPLET_HOST }}
          username: ${{ secrets.ECHAMOR_DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PATH_SSH_GH_KEY
          script: |
            set -e
            cd ${{ secrets.REPO_PATH }}
            export GIT_SSH_COMMAND="ssh -i \"$PATH_SSH_GH_KEY\" -o IdentitiesOnly=yes"
            git pull origin main
            sudo systemctl restart check-batches
            echo "## 🚀 Results" >> $GITHUB_STEP_SUMMARY
            echo "${journalctl -u check-batches -n 12}" >> $GITHUB_STEP_SUMMARY
